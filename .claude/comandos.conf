# Comandos do projeto, lidos pelos hooks (.claude/hooks/) e pelo Claude.
# Todos rodam DENTRO de projeto/: escreva os caminhos relativos a essa pasta.
# Preencha quando os comandos existirem de verdade (em geral no fechamento da etapa 1).
# Valor vazio = o hook correspondente não faz nada.
# Sintaxe de bash: NOME="valor". Os exemplos são de .NET; troque pelos da sua stack.

# Branch principal: recebe merge (ciclo ou ciclo curto) e, direto, só o README.md. A trava de commit recusa código direto nela.
# Em projeto existente, use o nome que o repositório já tem (ex.: master).
BRANCH_PRINCIPAL="main"

# Compila o projeto inteiro. Roda ao fim de cada resposta do Claude quando há código alterado.
# Ex.: BUILD="dotnet build MeuProjeto.slnx -nologo -v q -clp:ErrorsOnly"
BUILD=""

# Arquivos que, alterados e não commitados, disparam o BUILD (padrões do git, separados por espaço).
# Vazio = qualquer arquivo de projeto/ que não seja .md.
# Ex.: CODIGO="*.cs *.csproj *.props *.targets *.sln *.slnx"
CODIGO=""

# Erros do BUILD que não vêm do código (ex.: arquivo travado porque o programa está rodando).
# Expressão regular. Quando casar, o hook avisa você em vez de mandar o Claude corrigir.
# Ex.: BUILD_IGNORAR="MSB3021|MSB3026|MSB3027"
BUILD_IGNORAR=""

# Roda os testes automatizados. Não roda sozinho: o Claude usa ao fechar a etapa e ao corrigir bugs.
# Vazio = o projeto não tem testes.
# Ex.: TESTE="dotnet test MeuProjeto.slnx -nologo -v q"
TESTE=""

# Formata UM arquivo logo após o Claude editá-lo. {arquivo} vira o caminho do arquivo relativo a projeto/.
# Ex.: FORMATAR="dotnet format whitespace --folder --include {arquivo}"
FORMATAR=""

# Extensões que o FORMATAR aceita, separadas por espaço. Vazio = não formata nada.
# Ex.: FORMATAR_EXTENSOES="cs"
FORMATAR_EXTENSOES=""

# Como rodar o sistema localmente. Não roda sozinho: o Claude usa para verificar comportamento.
# Ex.: EXECUTAR="dotnet run --project src/MeuProjeto.Worker"
EXECUTAR=""

# Modelo e esforço das sessões de etapa e de ciclo curto abertas pelo gerente. Não são comandos: quem lê é
# o gerente, no /iniciar-etapa. Vazio = o mesmo do gerente. O app só aceita um modelo igual ou mais
# barato que o do gerente.
# Ex.: MODELO_ETAPA="claude-opus-5-5"   ESFORCO_ETAPA="medium"
MODELO_ETAPA=""
ESFORCO_ETAPA=""
